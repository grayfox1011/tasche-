<!-- wp:divi/text {"module":{"meta":{"adminLabel":{"desktop":{"value":"Testo"}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003e\u003cstrong\u003eUltimo aggiornamento:\u003c/strong\u003e {{date}}\u003c/p\u003e\n\u003cp\u003eLa presente informativa descrive come Tasche Piene tratta i dati personali in relazione al sito web {{url:home}}.\u003c/p\u003e\n\u003ch2\u003e1. Titolare del trattamento\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eBarrakuda S.r.l.\u003c/strong\u003e (Tasche Piene)\u003cbr\u003e Via Carducci 5/10, 16121 Genova\u003cbr\u003e P. IVA e C.F. 02789540990 \u003c/p\u003e\n\u003ch2\u003e2. Tipologia di sito\u003c/h2\u003e\n\u003cp\u003eIl sito ha finalità informativa e promozionale: presenta l’attività gastronomica, il menu e le informazioni utili per raggiungerci in negozio.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNon sono presenti moduli di contatto, form di iscrizione, newsletter o raccolta diretta di dati tramite e-mail sul sito.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2\u003e3. Dati trattati\u003c/h2\u003e\n\u003cp\u003ePotrebbero essere trattati, in modo limitato e per il solo funzionamento tecnico del sito:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003edati di navigazione e log tecnici (es. indirizzo IP, data e ora della richiesta, user agent del browser);\u003c/li\u003e\u003cli\u003ecookie e strumenti tecnici descritti nella \u003ca href=\u0022{{url:cookie}}\u0022\u003eCookie Policy\u003c/a\u003e.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eNon effettuiamo profilazione commerciale né invio di comunicazioni promozionali tramite il sito.\u003c/p\u003e\n\u003ch2\u003e4. Finalità e base giuridica\u003c/h2\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003eFunzionamento e sicurezza del sito\u003c/strong\u003e — legittimo interesse del titolare e necessità tecnica (art. 6, par. 1, lett. f GDPR).\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eCookie tecnici\u003c/strong\u003e — vedi Cookie Policy; per i cookie non strettamente necessari, ove presenti, il consenso viene richiesto separatamente.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003e5. Conservazione\u003c/h2\u003e\n\u003cp\u003eI dati tecnici di log sono conservati per il tempo strettamente necessario alla sicurezza e alla manutenzione del sito, secondo i termini del provider di hosting.\u003c/p\u003e\n\u003ch2\u003e6. Comunicazione e trasferimenti\u003c/h2\u003e\n\u003cp\u003eI dati possono essere trattati da fornitori tecnici (hosting, manutenzione sito) nominati responsabili del trattamento o autonomi titolari, solo per erogare il servizio.\u003c/p\u003e\n\u003ch2\u003e7. Diritti dell’interessato\u003c/h2\u003e\n\u003cp\u003eIn qualità di interessato puoi esercitare i diritti previsti dagli artt. 15-22 GDPR (accesso, rettifica, cancellazione, limitazione, opposizione, portabilità ove applicabile) rivolgendoti al titolare presso la sede indicata sopra.\u003c/p\u003e\n\u003cp\u003eHai inoltre diritto di proporre reclamo all’Autorità Garante per la protezione dei dati personali (\u003ca href=\u0022https://www.garanteprivacy.it\u0022 rel=\u0022noopener noreferrer\u0022 target=\u0022_blank\u0022\u003egaranteprivacy.it\u003c/a\u003e).\u003c/p\u003e\n\u003ch2\u003e8. Modifiche\u003c/h2\u003e\n\u003cp\u003eIl titolare può aggiornare la presente informativa; la versione aggiornata sarà pubblicata su questa pagina.\u003c/p\u003e"}},"decoration":{"bodyFont":{"body":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"400","size":"18px","lineHeight":"1.55em","color":"#3e372e"}},"phone":{"value":{"size":"17px"}}}},"link":{"font":{"desktop":{"value":{"color":"#560b22"}}}}},"headingFont":{"h2":{"font":{"desktop":{"value":{"family":"Bowlby One","weight":"400","size":"24px","lineHeight":"1.2em","color":"#054726"}},"phone":{"value":{"size":"21px"}}}}}}},"builderVersion":"5.15.1"} /-->
