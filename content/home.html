<!-- wp:divi/text {"module":{"meta":{"adminLabel":{"desktop":{"value":"Testo"}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eUn’idea di Davide e Alberto, imprenditori genovesi che di stare con le mani in mano non sono capaci.\u003c/p\u003e\n\u003cp\u003eGenova ha un centro storico che molte città si sognano. Ogni anno diventa più bella e più curata… ma un po’ meno sé stessa. I locali si moltiplicano, le insegne si assomigliano tutte, i menù cominciano sempre con «street food» e finiscono con «concept». Di quella musica lì, ne abbiamo le tasche piene.\u003c/p\u003e\n\u003cp\u003eOgni mattina nel nostro laboratorio cuociono le polpette nel sugo, lo stocco, la trippa, i ripieni liguri. Li mettiamo in tasca ancora caldi: il sugo inzuppa il pane e ogni morso è una scarpetta.\u003c/p\u003e"}},"decoration":{"bodyFont":{"body":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"500","size":"20px","lineHeight":"1.4em","color":"#560b22"}},"tablet":{"value":{"size":"19px"}},"phone":{"value":{"size":"18px"}}}}}}},"builderVersion":"5.15.1"} /-->
