<!-- wp:divi/text {"module":{"meta":{"adminLabel":{"desktop":{"value":"Testo"}}},"decoration":{"spacing":{"desktop":{"value":{"margin":{"top":"17px","right":"0px","bottom":"0px","left":"0px","syncVertical":"off","syncHorizontal":"on"}}},"phone":{"value":{"margin":{"top":"22px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eI caruggi si riempiono di locali con insegne tutte uguali. Davide e Alberto hanno scelto una strada diversa: riportare nel centro storico la \u003cb\u003ecucina delle case genovesi\u003c/b\u003e.\u003c/p\u003e\n\u003cp\u003eNel laboratorio di Via di Scurreria le pentole si accendono presto. Polpette morbide, stoccafisso accomodato, trippa e verdure ripiene cuociono con i tempi giusti, \u003cb\u003esenza semilavorati o cibi riscaldati\u003c/b\u003e.\u003c/p\u003e\n\u003cp\u003eLa tasca racchiude i piatti della tradizione in un pane croccante che raccoglie il sugo: effetto scarpetta assicurato! Un pranzo completo a partire da \u003cb\u003e5,50 €\u003c/b\u003e, pensato per chi lavora in zona, per chi abita nel quartiere e per chi passa da Piazza San Lorenzo per la prima volta.\u003c/p\u003e"}},"decoration":{"bodyFont":{"body":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"500","size":"20px","lineHeight":"1.4em","color":"#560b22"}},"tablet":{"value":{"size":"19px"}},"phone":{"value":{"size":"18px"}}}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/text {"module":{"meta":{"adminLabel":{"desktop":{"value":"Testo"}}},"decoration":{"spacing":{"desktop":{"value":{"margin":{"top":"24px","right":"0px","bottom":"0px","left":"0px","syncVertical":"off","syncHorizontal":"on"}}},"phone":{"value":{"margin":{"top":"19px"}}}},"sizing":{"desktop":{"value":{"maxWidth":"92.4%"}},"tablet":{"value":{"maxWidth":"100%"}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eTutte le ricette del banco sono prive di farina e pangrattato. Anche le polpette al sugo — impastate con amido di mais — e il polpettone sono \u003cb\u003e100% senza glutine\u003c/b\u003e.\u003c/p\u003e\n\u003cp\u003eProponiamo due versioni della tasca, classica e senza glutine. Entrambe restano croccanti e raccolgono bene il sugo. Il pane senza glutine è confezionato singolarmente e viene scaldato in un \u003cb\u003eforno dedicato\u003c/b\u003e. La cucina è una sola, ma usiamo \u003cb\u003eteglie chiuse e separate\u003c/b\u003e per evitare contaminazioni.\u003c/p\u003e\n\u003cp\u003eIn caso di celiachia, segnalalo allo staff al banco prima di ordinare oppure \u003cb\u003eindicatelo chiaramente nelle note del tuo ordine delivery\u003c/b\u003e.\u003c/p\u003e\n\u003cp\u003ePer informazioni dettagliate su ingredienti e preparazioni, puoi chiamarci o passare direttamente in locale.\u003c/p\u003e"}},"decoration":{"bodyFont":{"body":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"500","size":"20px","lineHeight":"1.39em","color":"#054726"}},"tablet":{"value":{"size":"19px"}},"phone":{"value":{"size":"18px","lineHeight":"1.42em"}}}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Che cos'è una tasca ripiena?"}}},"advanced":{"open":{"desktop":{"value":"on"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Che cos'è una tasca ripiena?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#054726"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eÈ un pane croccante, a metà tra una pinsa e un panino, riempito con una delle ricette del banco e scaldato al momento. Si mangia con le mani, anche camminando per i caruggi. Il ripieno è lo stesso che trovi nella vaschetta: polpette al sugo, melanzane alla parmigiana, ripieni liguri, pollo alla ligure. Da 5,50 €.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#054726","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Tasca o vaschetta: che differenza c'è?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Tasca o vaschetta: che differenza c'è?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#560b22"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eLa ricetta è la stessa, cambia come la mangi. La tasca è il pane ripieno. La vaschetta è il piatto: media da 200 g o grande da 400 g, con un contorno incluso e, se vuoi, il pane croccante a parte. La vaschetta è anche quella che arriva a casa con Deliveroo e Just Eat.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#560b22","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Siete senza glutine?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Siete senza glutine?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#054726"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eTutte le ricette del banco sono preparate senza glutine. Non usiamo farina né pangrattato, nemmeno nel polpettone: le polpette, per esempio, le leghiamo con l'amido. Il pane della tasca senza glutine è confezionato singolarmente e lo scaldiamo in forno sigillato nella stagnola. La cucina però è una sola e non abbiamo una certificazione: se hai la celiachia dillo al banco, così ne parliamo.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#054726","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Cosa trovo nel banco e cosa cambia?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Cosa trovo nel banco e cosa cambia?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#560b22"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eOgni mattina cuciniamo nel nostro laboratorio quello che vedi nel banco: polpette al sugo, melanzane alla parmigiana, pollo alla ligure con olive taggiasche e pinoli, le acciughe di Luciano con la stracciatella, la caprese con il pesto. I ripieni di verdura cambiano con la stagione. Quando una cosa finisce, è finita: non riscaldiamo per rivendere.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#560b22","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Quando c'è la trippa e quando lo stoccafisso?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Quando c'è la trippa e quando lo stoccafisso?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#054726"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eLo stoccafisso alla ligure c’è tutti i giorni. La trippa alla genovese il martedì e il venerdì: le trippe arrivano dalla Tripperia La Casana, bottega storica del centro. Ne prepariamo 10-12 porzioni, quindi conviene passare presto. Tutti e due si possono avere in tasca o in vaschetta.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#054726","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Posso mangiare da voi o solo da asporto?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Posso mangiare da voi o solo da asporto?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#560b22"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eTutte e due le cose. Puoi mangiare da noi, portare via la tasca e mangiarla dove vuoi tu, oppure farti consegnare la vaschetta a casa o in ufficio.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#560b22","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Fate consegne a domicilio?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Fate consegne a domicilio?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#054726"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eSì, con \u003ca href=\u0022https://deliveroo.it/it/menu/genova/genova-centro/tasche-piene-genova-centro\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eDeliveroo\u003c/a\u003e e \u003ca href=\u0022https://www.justeat.it/restaurants-tasche-piene-genova/menu\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eJust Eat\u003c/a\u003e, negli orari di apertura. Dal banco invece si ordina e si porta via senza prenotare.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#054726","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Dove siete?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Dove siete?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#560b22"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eIn via di Scurreria 42/R, su piazza San Lorenzo, a due passi dalla Cattedrale. Siamo nei caruggi, ma non troppo nascosti. \u003ca href=\u0022https://www.google.com/maps/search/?api=1\u0026query=Tasche+Piene+Via+di+Scurreria+42+Genova\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003eApri la mappa\u003c/a\u003e oppure chiamaci al \u003ca href=\u0022tel:+390104075541\u0022\u003e010 407 5541\u003c/a\u003e.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#560b22","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Quali sono gli orari?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Quali sono gli orari?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#054726"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003elunedì 12–21\u003cbr\u003emartedì 12–21\u003cbr\u003emercoledì 12–21\u003cbr\u003egiovedì 12–21\u003cbr\u003evenerdì 12–21\u003cbr\u003esabato 12–22\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#054726","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Quanto costa un pranzo?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Quanto costa un pranzo?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#560b22"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eUna tasca costa da 5,50 a 7,50 €. Una vaschetta media da 6,00 €, grande da 9,00 €, con il contorno incluso. Patate o verdure al forno a parte 1,50 €, un dolce 4,50 €, la spumetta al bicchiere 0,90 €.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#560b22","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->

<!-- wp:divi/accordion-item {"module":{"meta":{"adminLabel":{"desktop":{"value":"Domanda: Ho un'allergia: come faccio?"}}},"advanced":{"open":{"desktop":{"value":"off"}}},"decoration":{"border":{"desktop":{"value":{"radius":{"topLeft":"20px","topRight":"20px","bottomRight":"20px","bottomLeft":"20px","sync":"on"},"styles":{"all":{"width":"3px","color":"#c5b197","style":"solid"}}}}},"spacing":{"desktop":{"value":{"padding":{"top":"28px","right":"33px","bottom":"28px","left":"33px","syncVertical":"off","syncHorizontal":"off"}}},"phone":{"value":{"padding":{"top":"20px","right":"20px","bottom":"20px","left":"20px"}}}}}},"title":{"innerContent":{"desktop":{"value":"Ho un'allergia: come faccio?"}},"decoration":{"font":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"900","size":"20px","lineHeight":"1.15em","color":"#054726"}},"phone":{"value":{"size":"17px"}}}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003eChiedi al banco: sappiamo cosa c'è in ogni ricetta perché la facciamo noi. La lista degli allergeni è esposta in negozio e sul menù qui sopra.\u003c/p\u003e"}}},"closedToggleIcon":{"decoration":{"icon":{"desktop":{"value":{"color":"#054726","useSize":"on","size":"20px"}}}}},"builderVersion":"5.15.1"} /-->
