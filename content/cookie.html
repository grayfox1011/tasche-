<!-- wp:divi/text {"module":{"meta":{"adminLabel":{"desktop":{"value":"Testo"}}}},"content":{"innerContent":{"desktop":{"value":"\u003cp\u003e\u003cstrong\u003eUltimo aggiornamento:\u003c/strong\u003e {{date}}\u003c/p\u003e\n\u003cp\u003eQuesta Cookie Policy spiega come Tasche Piene utilizza cookie e tecnologie simili sul sito {{url:home}}.\u003c/p\u003e\n\u003ch2\u003e1. Cosa sono i cookie\u003c/h2\u003e\n\u003cp\u003eI cookie sono piccoli file di testo che i siti possono salvare sul dispositivo dell’utente per memorizzare preferenze o informazioni tecniche.\u003c/p\u003e\n\u003ch2\u003e2. Cookie utilizzati da questo sito\u003c/h2\u003e\n\u003cp\u003eIl sito utilizza principalmente \u003cstrong\u003ecookie tecnici\u003c/strong\u003e, necessari al corretto funzionamento della piattaforma WordPress e alla visualizzazione delle pagine.\u003c/p\u003e\n\u003cp\u003eTra questi possono rientrare, a seconda della configurazione del server:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003ecookie di sessione o tecnici di WordPress;\u003c/li\u003e\u003cli\u003ecookie legati alla sicurezza e alla cache del sito;\u003c/li\u003e\u003cli\u003epreferenze salvate dal builder o dal tema per la corretta resa grafica.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eNon utilizziamo cookie di profilazione o pubblicitari\u003c/strong\u003e e non raccogliamo dati tramite form o newsletter sul sito.\u003c/p\u003e\n\u003cp\u003eSe in futuro venissero attivati strumenti di analisi o marketing (es. Google Analytics, pixel social), questa informativa sarà aggiornata e, ove richiesto, verrà richiesto il consenso tramite apposito banner.\u003c/p\u003e\n\u003ch2\u003e3. Cookie di terze parti\u003c/h2\u003e\n\u003cp\u003eIl sito può includere link esterni (es. mappe o profili social). Cliccando su tali link si accede a siti di terze parti con informative autonome.\u003c/p\u003e\n\u003ch2\u003e4. Come gestire i cookie dal browser\u003c/h2\u003e\n\u003cp\u003ePuoi configurare il browser per bloccare o cancellare i cookie. La disabilitazione dei cookie tecnici potrebbe compromettere alcune funzioni del sito.\u003c/p\u003e\n\u003ch2\u003e5. Titolare e privacy\u003c/h2\u003e\n\u003cp\u003ePer il trattamento dei dati personali collegato all’uso del sito, vedi la \u003ca href=\u0022{{url:privacy}}\u0022\u003ePrivacy Policy\u003c/a\u003e.\u003c/p\u003e"}},"decoration":{"bodyFont":{"body":{"font":{"desktop":{"value":{"family":"DM Sans","weight":"400","size":"18px","lineHeight":"1.55em","color":"#3e372e"}},"phone":{"value":{"size":"17px"}}}},"link":{"font":{"desktop":{"value":{"color":"#560b22"}}}}},"headingFont":{"h2":{"font":{"desktop":{"value":{"family":"Bowlby One","weight":"400","size":"24px","lineHeight":"1.2em","color":"#054726"}},"phone":{"value":{"size":"21px"}}}}}}},"builderVersion":"5.15.1"} /-->
